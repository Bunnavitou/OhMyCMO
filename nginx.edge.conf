server {
    listen 80;
    server_name _;

    # Requests arrive here unmodified from macmini-edge (still prefixed with
    # /ohmycmo/, matching how the built assets and API calls are baked to
    # reference that prefix — see Dockerfile.edge's VITE_BASE_PATH/VITE_API_URL).

    # See nginx.conf: invoice saves PATCH a product's entire income array, which
    # exceeds nginx's 1m default on products with real billing history.
    client_max_body_size 25m;

    location /ohmycmo/api/ {
        rewrite           ^/ohmycmo/api/(.*)$ /api/$1 break;
        proxy_pass         http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The API sets the refresh-token cookie with Path=/api/auth, which
        # would never match the browser's real /ohmycmo/api/auth path —
        # rewrite it here rather than teaching the API about edge prefixes.
        proxy_cookie_path  /api/auth /ohmycmo/api/auth;
    }

    location /ohmycmo/ {
        rewrite ^/ohmycmo/(.*)$ /$1 break;
        root    /usr/share/nginx/html;
        # No $uri/ candidate: when the stripped $uri is exactly "/" it matches
        # the html root as an existing directory, and try_files' internal
        # redirect for that candidate uses the already-stripped path — which
        # escapes this location block entirely (falls through to nginx's
        # compiled-in default root). Going straight from $uri to the prefixed
        # fallback avoids that; this is an SPA, no real directories to index.
        try_files $uri /ohmycmo/index.html;
    }

    location = /ohmycmo {
        return 301 /ohmycmo/;
    }
}
