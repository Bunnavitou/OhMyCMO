server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (react-router client-side routing)
    location / {
        try_files $uri /index.html;
    }

    # Saving one invoice PATCHes a product's whole income array back, so bodies
    # scale with billing history (plus base64 email attachments). nginx's 1m
    # default silently 413s those; match the API's express.json 25mb limit.
    client_max_body_size 25m;

    # Same-origin API proxy — Express mounts routes under /api itself,
    # so the path is forwarded unchanged (no path component on proxy_pass).
    location /api/ {
        proxy_pass         http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
